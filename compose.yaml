services:
  postgres:
    image: 'postgres:16-alpine'
    environment:
      POSTGRES_DB: agentic_rpg
      POSTGRES_USER: agentic_rpg
      POSTGRES_PASSWORD: agentic_rpg
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    # 7.4+ pinned for HEXPIRE per-field TTL on hash entries — used by the
    # ground-item store to expire NPC loot drops.
    image: 'redis:7.4-alpine'
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data: