spring:
  application:
    name: genesara-engine
  mvc:
    problemdetails:
      enabled: true
  flyway:
    out-of-order: true
    locations:
      - classpath:db/migration/world-core
      - classpath:db/migration/account
      - classpath:db/migration/player
      - classpath:db/migration/admin
  datasource:
    hikari:
      # Sized for parallel per-world tick fan-out. Raise alongside MAX_LEASES_PER_POD:
      # at least (MAX_LEASES_PER_POD × 2) + sync_tool_concurrency. See
      # docs/persistence.md "Connection sizing".
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  ai:
    mcp:
      server:
        name: "genesara-mcp"
        version: 1.0.0
        protocol: STREAMABLE
#        stdio: false
#        sse-endpoint: /sse
        sse-message-endpoint: /mcp/message
        streamable-http:
          mcp-endpoint: /mcp


application:
  security:
    cors:
      allowed-origins:
        - http://localhost:5173
        - https://genesara.github.io
        - https://genesara.com
    jwt:
      # HS256 secret. Must be >= 32 bytes. Set SECURITY_JWT_SECRET in any non-dev env.
      secret: ${SECURITY_JWT_SECRET:dev-only-jwt-secret-change-me-please-32-bytes-min}
      ttl: PT24H
  tick:
    interval: PT1S
  shard:
    # Stable identity for this JVM. Defaults to a fresh UUID per start.
    pod-id: ${POD_ID:${random.uuid}}
    lease:
      # Cap on per-world leases this pod will hold. Defaults effectively
      # unbounded so single-pod deployments tick every world.
      max-per-pod: ${MAX_LEASES_PER_POD:1024}
      # Lease TTL. Must be >= 2 × tick.interval so one missed renewal
      # (e.g. a 5s GC pause) doesn't drop the lease.
      ttl: PT10S
  presence:
    timeout: PT30M
    reaper-interval: PT1M
    flush-interval: PT60S
  events:
    backlog-cap: 500
    ttl: PT1H

# Admin bootstrap — set ADMIN_BOOTSTRAP_USERNAME / ADMIN_BOOTSTRAP_PASSWORD env vars to
# seed the first admin on startup (idempotent: only runs when the admins table is empty).
admin:
  bootstrap:
    username: ${ADMIN_BOOTSTRAP_USERNAME:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}
