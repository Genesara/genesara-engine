# Refining recipes — raw harvests → stackable intermediates that gate T2 equipment
# (and forward-compatible with future T2/T3 building costs). All RESOURCE outputs;
# no rarity / durability roll, no creator signature.
#
# Bind point: `RecipeBalanceConfiguration.@PropertySource` — see also
# recipes-{weapons,armor,jewelry,consumables}.yaml. All five files contribute
# keys under `recipes.catalog` and merge at bind time.

recipes:
  catalog:

    IRON_INGOT_BASIC:
      output: { item: IRON_INGOT, quantity: 1 }
      inputs:
        ORE: 3
        COAL: 1
      required-station: CRAFTING_STATION_METAL
      required-skill: SMITHING
      required-skill-level: 0
      stamina-cost: 12

    GOLD_INGOT_BASIC:
      output: { item: GOLD_INGOT, quantity: 1 }
      inputs:
        GOLD: 2
        COAL: 1
      required-station: CRAFTING_STATION_METAL
      required-skill: SMITHING
      required-skill-level: 3
      stamina-cost: 14

    # Per-instance copy recipe: the `craft` command must supply `source` =
    # an existing GATE_KEY instance the caller holds. The source is NOT
    # consumed; the new key inherits the source's gate-binding. Inputs
    # (IRON_INGOT) are consumed normally. Output is a per-instance KEY row in
    # agent_item_instances, not the stackable inventory.
    GATE_KEY_COPY:
      output: { item: GATE_KEY, quantity: 1 }
      inputs:
        IRON_INGOT: 1
      required-station: CRAFTING_STATION_WOOD
      required-skill: CARPENTRY
      required-skill-level: 0
      stamina-cost: 10
      requires-source: GATE_KEY

    LEATHER_BASIC:
      output: { item: LEATHER, quantity: 1 }
      inputs:
        HIDE: 2
      required-station: CRAFTING_STATION_WOOD
      required-skill: CARPENTRY
      required-skill-level: 0
      stamina-cost: 8

    FIBER_BASIC:
      output: { item: FIBER, quantity: 3 }
      inputs:
        WOOD: 1
      required-station: CRAFTING_STATION_WOOD
      required-skill: CARPENTRY
      required-skill-level: 0
      stamina-cost: 6

    PLANK_BASIC:
      output: { item: PLANK, quantity: 2 }
      inputs:
        WOOD: 3
      required-station: CRAFTING_STATION_WOOD
      required-skill: CARPENTRY
      required-skill-level: 0
      stamina-cost: 6

    CLOTH_BASIC:
      output: { item: CLOTH, quantity: 1 }
      inputs:
        FIBER: 3
      required-station: CRAFTING_STATION_WOOD
      required-skill: CARPENTRY
      required-skill-level: 0
      stamina-cost: 8

    BRICK_BASIC:
      output: { item: BRICK, quantity: 1 }
      inputs:
        CLAY: 3
      required-station: CRAFTING_STATION_WOOD
      required-skill: CARPENTRY
      required-skill-level: 0
      stamina-cost: 8

    HEALING_SALVE_BASIC:
      output: { item: HEALING_SALVE, quantity: 1 }
      inputs:
        HERB: 2
        MUSHROOM: 1
      required-station: CRAFTING_STATION_POTION
      required-skill: ALCHEMY
      required-skill-level: 0
      stamina-cost: 10

    # ───────────── Fauna-tier intermediates ─────────────

    BONE_MEAL_GRIND:
      output: { item: BONE_MEAL, quantity: 2 }
      inputs:
        BONE: 1
      required-station: CRAFTING_STATION_WOOD
      required-skill: CARPENTRY
      required-skill-level: 0
      stamina-cost: 6

    BOWSTRING_WEAVE:
      output: { item: BOWSTRING, quantity: 1 }
      inputs:
        SINEW: 2
      required-station: CRAFTING_STATION_WOOD
      required-skill: LEATHERWORKING
      required-skill-level: 0
      stamina-cost: 6

    DRIED_FUR_PROCESS:
      output: { item: DRIED_FUR, quantity: 1 }
      inputs:
        FUR: 1
      required-station: CRAFTING_STATION_WOOD
      required-skill: LEATHERWORKING
      required-skill-level: 10
      stamina-cost: 8

    VENOM_EXTRACT_DISTILL:
      output: { item: VENOM_EXTRACT, quantity: 1 }
      inputs:
        GLAND: 2
      required-station: CRAFTING_STATION_POTION
      required-skill: ALCHEMY
      required-skill-level: 20
      stamina-cost: 10

    HARDENED_LEATHER_CURE:
      output: { item: HARDENED_LEATHER, quantity: 1 }
      inputs:
        HIDE: 2
        GLAND: 1
      required-station: CRAFTING_STATION_WOOD
      required-skill: LEATHERWORKING
      required-skill-level: 30
      stamina-cost: 12
