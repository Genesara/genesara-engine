items:
  catalog:

    # ───────────────────────── Renewable organics ─────────────────────────

    WOOD:
      display-name: Wood
      description: >-
        Rough timber gathered from forest nodes. Used for low-tier crafting and fuel.
      category: RESOURCE
      weight-per-unit: 800
      max-stack: 200
      regenerating: true
      regen-interval-ticks: 500
      regen-amount: 5
      harvest-skill: LUMBERJACKING

    BERRY:
      display-name: Wild Berries
      description: >-
        Edible forage. Restores a small amount of hunger when consumed. Found in
        forest and plains nodes.
      category: RESOURCE
      weight-per-unit: 50
      max-stack: 200
      regenerating: true
      regen-interval-ticks: 100
      regen-amount: 5
      harvest-skill: FORAGING
      consumable:
        gauge: HUNGER
        amount: 20

    HERB:
      display-name: Wild Herb
      description: >-
        Medicinal plant. Useful as an alchemy reagent or as a low-tier consumable.
        Common in forest, plains, and wetland biomes.
      category: RESOURCE
      weight-per-unit: 30
      max-stack: 200
      regenerating: true
      regen-interval-ticks: 100
      regen-amount: 5
      harvest-skill: FORAGING
      consumable:
        gauge: HUNGER
        amount: 10

    MUSHROOM:
      display-name: Wild Mushroom
      description: >-
        Edible fungi from damp forest floors and swamps. Decent hunger restore;
        regenerates quickly under shade.
      category: RESOURCE
      weight-per-unit: 40
      max-stack: 200
      regenerating: true
      regen-interval-ticks: 100
      regen-amount: 5
      harvest-skill: FORAGING
      consumable:
        gauge: HUNGER
        amount: 15

    FISH:
      display-name: Fish
      description: >-
        Caught from coastal waters and river deltas. Dense calories — the best
        wild food source by hunger refilled per unit.
      category: RESOURCE
      weight-per-unit: 300
      max-stack: 100
      regenerating: true
      regen-interval-ticks: 200
      regen-amount: 3
      harvest-skill: FISHING
      consumable:
        gauge: HUNGER
        amount: 30

    HIDE:
      display-name: Hide
      description: >-
        Tough animal hide. Drops from fauna NPC kills (see #20 Phase 2 — NPCs).
        Not gatherable from terrain; the leather chain is dormant in v1 until
        the hunting verb lands.
      category: RESOURCE
      weight-per-unit: 600
      max-stack: 100
      regenerating: false

    # ─────────────────────── Fauna drops (Phase 2 — NPCs) ──────────────────────
    # All raw materials below drop from fauna NPC kills. The harvest verb does
    # not hit these — `harvest-skill: HUNTING` is purely informational metadata
    # (tagging the resource's origin domain). HUNTING xp accrues on the kill
    # itself (see AttackNpcReducer), not on consume.

    MEAT:
      display-name: Meat
      description: Edible raw meat from fauna kills. Cooks into preserved foods.
      category: RESOURCE
      weight-per-unit: 300
      max-stack: 99
      regenerating: false
      harvest-skill: HUNTING

    FUR:
      display-name: Fur
      description: Warm pelt distinct from HIDE. Tailoring input.
      category: RESOURCE
      weight-per-unit: 400
      max-stack: 99
      regenerating: false
      harvest-skill: HUNTING

    BONE:
      display-name: Bone
      description: Structural material for tools and crafting.
      category: RESOURCE
      weight-per-unit: 400
      max-stack: 99
      regenerating: false
      harvest-skill: HUNTING

    FANG:
      display-name: Fang
      description: Predator tooth. Weapons and jewelry component.
      category: RESOURCE
      weight-per-unit: 80
      max-stack: 99
      regenerating: false
      harvest-skill: HUNTING

    SINEW:
      display-name: Sinew
      description: Animal cordage for leatherworking and bowstrings.
      category: RESOURCE
      weight-per-unit: 200
      max-stack: 99
      regenerating: false
      harvest-skill: HUNTING

    FEATHER:
      display-name: Feather
      description: Bird plumage. Tailoring and fletching.
      category: RESOURCE
      weight-per-unit: 200
      max-stack: 99
      regenerating: false
      harvest-skill: HUNTING

    HORN:
      display-name: Horn
      description: Horned-mammal keratin. Tools and jewelry.
      category: RESOURCE
      weight-per-unit: 400
      max-stack: 99
      regenerating: false
      harvest-skill: HUNTING

    SCALE:
      display-name: Scale
      description: Reptile or large-fish scale. Armor substrate.
      category: RESOURCE
      weight-per-unit: 300
      max-stack: 99
      regenerating: false
      harvest-skill: HUNTING

    CHITIN:
      display-name: Chitin
      description: Arthropod exoskeleton plate. Light armor.
      category: RESOURCE
      weight-per-unit: 350
      max-stack: 99
      regenerating: false
      harvest-skill: HUNTING

    GLAND:
      display-name: Gland
      description: Venomous or scent gland. Alchemy reagent.
      category: RESOURCE
      weight-per-unit: 200
      max-stack: 99
      regenerating: false
      harvest-skill: HUNTING

    HONEY:
      display-name: Honey
      description: Bee product. Cooking and brewing input.
      category: RESOURCE
      weight-per-unit: 300
      max-stack: 99
      regenerating: false
      harvest-skill: HUNTING

    FIBER:
      display-name: Plant Fiber
      description: >-
        Coarse plant fiber stripped from inner bark. Refined at a workbench
        from raw WOOD; not gatherable directly from terrain.
      category: RESOURCE
      weight-per-unit: 100
      max-stack: 200
      regenerating: false

    # ───────────────────── Renewable building / fuel ──────────────────────

    CLAY:
      display-name: Clay
      description: >-
        Wet earth from riverbanks and wetlands. Used for low-tier construction and
        ceramics. Slowly recovers as river sediment settles.
      category: RESOURCE
      weight-per-unit: 1200
      max-stack: 100
      regenerating: true
      regen-interval-ticks: 500
      regen-amount: 4
      harvest-skill: MINING

    PEAT:
      display-name: Peat
      description: >-
        Compressed organic matter cut from swamps and wetlands. Burns hot and slow;
        a fuel for forges and fires.
      category: RESOURCE
      weight-per-unit: 600
      max-stack: 150
      regenerating: true
      regen-interval-ticks: 800
      regen-amount: 3
      harvest-skill: MINING

    SAND:
      display-name: Sand
      description: >-
        Loose mineral grains from deserts and shorelines. A future glasswork
        material; replenishes very slowly via wind and tide.
      category: RESOURCE
      weight-per-unit: 1500
      max-stack: 100
      regenerating: true
      regen-interval-ticks: 2000
      regen-amount: 2
      harvest-skill: MINING

    # ─────────────────── Non-regenerating geological ──────────────────────

    STONE:
      display-name: Stone
      description: >-
        Loose rocks pried from mountain and ruin nodes. Trained MINING speeds the
        work; untrained agents still get stone, just slower. Once stripped, the
        deposit is gone — geology is slow.
      category: RESOURCE
      weight-per-unit: 1500
      max-stack: 100
      regenerating: false
      harvest-skill: MINING

    ORE:
      display-name: Ore
      description: >-
        Raw metal-bearing ore. Smelts into ingots at a forge. Mountain and volcanic
        biomes. Non-renewable: rich nodes are a finite advantage. Reachable only
        via the `extract` verb at a built MINE (bare gather no longer yields ORE).
      category: RESOURCE
      weight-per-unit: 2000
      max-stack: 50
      regenerating: false
      harvest-skill: MINING
      extraction-only: true

    COAL:
      display-name: Coal
      description: >-
        Bituminous fuel from mountain seams and volcanic flows. Required for
        higher-tier forges. Non-renewable. Reachable only via the `extract`
        verb at a built MINE.
      category: RESOURCE
      weight-per-unit: 1800
      max-stack: 80
      regenerating: false
      harvest-skill: MINING
      extraction-only: true

    GOLD:
      display-name: Gold Nugget
      description: >-
        Raw gold ore. Smelts into a gold ingot at a forge. Found in trace
        quantities on MOUNTAIN / VOLCANIC / CRYSTAL_CAVES nodes — but only
        reachable via the `extract` verb at a built MINE.
      category: RESOURCE
      weight-per-unit: 2200
      max-stack: 50
      regenerating: false
      harvest-skill: MINING
      extraction-only: true

    GEM:
      display-name: Gemstone
      description: >-
        Rare crystalline deposit from caves and deep mountain pockets. High value
        per unit; sparse and non-renewable.
      category: RESOURCE
      weight-per-unit: 200
      max-stack: 30
      regenerating: false
      harvest-skill: MINING

    SALT:
      display-name: Salt
      description: >-
        Mineral salt from salt flats and rare coastal evaporite pockets. Used for
        food preservation. Non-renewable on a meaningful scale.
      category: RESOURCE
      weight-per-unit: 1000
      max-stack: 100
      regenerating: false
      harvest-skill: MINING

    # ────────────────── Refined intermediates (craftable) ─────────────────
    # These exist only as outputs of the crafting layer (#8). They are RESOURCE
    # category — stackable in agent_inventory, no rarity / durability — and feed
    # T2 equipment recipes. They are also forward-compatible inputs to future
    # T2/T3 building recipes; the building catalog stays unchanged in this slice.

    IRON_INGOT:
      display-name: Iron Ingot
      description: >-
        Smelted iron bar from ore + coal at a forge. The metal substrate for
        T2 weapons, armor, and jewelry recipes.
      category: RESOURCE
      weight-per-unit: 1500
      max-stack: 50
      regenerating: false

    GOLD_INGOT:
      display-name: Gold Ingot
      description: >-
        Smelted gold bar from nugget + coal at a forge. Luxury substrate for
        gold-tier jewelry. Not engine currency — agents may use it as a trade
        good if they choose.
      category: RESOURCE
      weight-per-unit: 1800
      max-stack: 50
      regenerating: false

    GATE_KEY:
      display-name: Gate Key
      description: >-
        Per-instance physical key bound to one specific GATE building. Required
        to toggle that gate's OPEN/CLOSED state. Auto-issued to the builder on
        gate completion; copies are minted at a WORKBENCH via `copy_gate_key`
        (template required, not consumed).
      category: KEY
      weight-per-unit: 100
      max-stack: 1
      regenerating: false

    LEATHER:
      display-name: Leather
      description: >-
        Tanned hide ready for stitching. Substrate for T1 armor and bracelet
        recipes. Tanning is performed at a workbench (CARPENTRY stand-in until
        a dedicated leatherworking skill lands).
      category: RESOURCE
      weight-per-unit: 400
      max-stack: 50
      regenerating: false

    CLOTH:
      display-name: Cloth
      description: >-
        Woven fabric from plant fiber. Substrate for cloth armor and future
        quivers / bandages.
      category: RESOURCE
      weight-per-unit: 200
      max-stack: 100
      regenerating: false

    BRICK:
      display-name: Brick
      description: >-
        Fired clay brick. Forward-compatible input for future T2/T3 building
        recipes; not consumed by Phase 1 buildings yet.
      category: RESOURCE
      weight-per-unit: 1000
      max-stack: 100
      regenerating: false

    PLANK:
      display-name: Plank
      description: >-
        Sawn lumber refined from raw wood at a workbench. Input for T2 building
        construction where structural integrity matters — rough timber alone
        won't do.
      category: RESOURCE
      weight-per-unit: 1200
      max-stack: 200
      regenerating: false

    HEALING_SALVE:
      display-name: Healing Salve
      description: >-
        Concentrated herb extract used as the alchemy substrate for HEALTH_POTION
        and future restoratives. No standalone consumption hook.
      category: RESOURCE
      weight-per-unit: 100
      max-stack: 30
      regenerating: false

    HEALTH_POTION:
      display-name: Health Potion
      description: >-
        Single-dose bottled restorative for combat phases. Consumable hook is TODO
        once an HP-regen gauge lands in the survival system; the recipe ships with
        this slice so the alchemy chain is exercisable end-to-end.
      category: RESOURCE
      weight-per-unit: 100
      max-stack: 30
      regenerating: false

    # ───────────────────────── Cultivated (#18) ─────────────────────────
    # Each crop ships ONE item: the harvest output. Planting consumes one unit
    # of that same item — there is no separate seed item. Crops also spawn
    # rarely on their preferred terrains (see terrains.yaml resource-spawns)
    # so day-0 agents can forage a starter unit and bootstrap a garden.

    WHEAT:
      display-name: Wheat
      description: Cultivated grain. Plantable on PLAINS / MEADOW. Foraged rarely from the same.
      category: RESOURCE
      weight-per-unit: 60
      max-stack: 200
      regenerating: false
      harvest-skill: FARMING
      consumable:
        gauge: HUNGER
        amount: 12

    POTATO:
      display-name: Potato
      description: Cultivated tuber. Plantable on PLAINS / MEADOW / HILLS.
      category: RESOURCE
      weight-per-unit: 200
      max-stack: 150
      regenerating: false
      harvest-skill: FARMING
      consumable:
        gauge: HUNGER
        amount: 25

    TOMATO:
      display-name: Tomato
      description: Cultivated fruit. Plantable on PLAINS / MEADOW.
      category: RESOURCE
      weight-per-unit: 80
      max-stack: 150
      regenerating: false
      harvest-skill: FARMING
      consumable:
        gauge: HUNGER
        amount: 15

    PEPPER:
      display-name: Pepper
      description: Cultivated spice.
      category: RESOURCE
      weight-per-unit: 60
      max-stack: 200
      regenerating: false
      harvest-skill: FARMING
      consumable:
        gauge: HUNGER
        amount: 10

    CORN:
      display-name: Corn
      description: Cultivated grain. Plantable on PLAINS / MEADOW.
      category: RESOURCE
      weight-per-unit: 150
      max-stack: 200
      regenerating: false
      harvest-skill: FARMING
      consumable:
        gauge: HUNGER
        amount: 20

    PUMPKIN:
      display-name: Pumpkin
      description: Cultivated gourd. Largest hunger restore raw.
      category: RESOURCE
      weight-per-unit: 500
      max-stack: 100
      regenerating: false
      harvest-skill: FARMING
      consumable:
        gauge: HUNGER
        amount: 35

    # ─────────────────────── Cooked + medical (#18) ──────────────────────
    # Recipes for the harvested crops. Live in recipes-cooking.yaml.

    BREAD:
      display-name: Bread
      description: Baked from wheat at a campfire. Larger hunger restore than raw wheat.
      category: RESOURCE
      weight-per-unit: 100
      max-stack: 100
      regenerating: false
      consumable:
        gauge: HUNGER
        amount: 30

    VEGETABLE_STEW:
      display-name: Vegetable Stew
      description: Slow-cooked at a campfire. Restores hunger AND thirst.
      category: RESOURCE
      weight-per-unit: 250
      max-stack: 50
      regenerating: false
      consumable:
        gauge: HUNGER
        amount: 45

    HERBAL_REMEDY:
      display-name: Herbal Remedy
      description: Bitter tonic distilled from cultivated herbs at an alchemy table. Restores hunger.
      category: RESOURCE
      weight-per-unit: 50
      max-stack: 50
      regenerating: false
      consumable:
        gauge: HUNGER
        amount: 20

    PUMPKIN_BREAD:
      display-name: Pumpkin Bread
      description: Dense seasonal loaf. Largest hunger restore in the cooking line.
      category: RESOURCE
      weight-per-unit: 350
      max-stack: 50
      regenerating: false
      consumable:
        gauge: HUNGER
        amount: 60

    # ─────────────────────── Fauna cuisine (Phase 2 — NPCs) ────────────────────
    # Cooked outputs for the meat / fish chain. Recipes land in Slice 3.

    ROAST_MEAT:
      display-name: Roast Meat
      description: Fire-roasted cut. Quick campfire meal.
      category: RESOURCE
      weight-per-unit: 300
      max-stack: 20
      regenerating: false
      consumable:
        gauge: HUNGER
        amount: 20

    MEAT_STEW:
      display-name: Meat Stew
      description: Slow-cooked stew with vegetables.
      category: RESOURCE
      weight-per-unit: 400
      max-stack: 20
      regenerating: false
      consumable:
        gauge: HUNGER
        amount: 35

    GAME_PIE:
      display-name: Game Pie
      description: Pastry-wrapped game with herbs.
      category: RESOURCE
      weight-per-unit: 500
      max-stack: 20
      regenerating: false
      consumable:
        gauge: HUNGER
        amount: 45

    HEARTY_BROTH:
      display-name: Hearty Broth
      description: Bone-rich broth simmered with marrow.
      category: RESOURCE
      weight-per-unit: 400
      max-stack: 20
      regenerating: false
      consumable:
        gauge: HUNGER
        amount: 25

    SMOKED_MEAT:
      display-name: Smoked Meat
      description: Preserved at a smokehouse. Long shelf-life.
      category: RESOURCE
      weight-per-unit: 300
      max-stack: 20
      regenerating: false
      consumable:
        gauge: HUNGER
        amount: 20

    SMOKED_FISH:
      display-name: Smoked Fish
      description: Preserved at a smokehouse.
      category: RESOURCE
      weight-per-unit: 300
      max-stack: 20
      regenerating: false
      consumable:
        gauge: HUNGER
        amount: 20

    JERKY:
      display-name: Jerky
      description: Salt-cured strips. Lightweight travel ration.
      category: RESOURCE
      weight-per-unit: 300
      max-stack: 20
      regenerating: false
      consumable:
        gauge: HUNGER
        amount: 15

    VENISON_ROAST:
      display-name: Venison Roast
      description: A whole roast cut from large game.
      category: RESOURCE
      weight-per-unit: 600
      max-stack: 20
      regenerating: false
      consumable:
        gauge: HUNGER
        amount: 60

    BONE_MARROW_SOUP:
      display-name: Bone Marrow Soup
      description: Rich soup rendered from cracked bones.
      category: RESOURCE
      weight-per-unit: 500
      max-stack: 20
      regenerating: false
      consumable:
        gauge: HUNGER
        amount: 30

    # ─────────────────────── Brewed drinks (Phase 2) ──────────────────────────

    ALE:
      display-name: Ale
      description: Grain ale from a brewery.
      category: RESOURCE
      weight-per-unit: 80
      max-stack: 10
      regenerating: false
      consumable:
        gauge: THIRST
        amount: 25

    BERRY_WINE:
      display-name: Berry Wine
      description: Fermented wild berries.
      category: RESOURCE
      weight-per-unit: 80
      max-stack: 10
      regenerating: false
      consumable:
        gauge: THIRST
        amount: 30

    HERBAL_TONIC:
      display-name: Herbal Tonic
      description: Steeped wild herbs. Bitter but refreshing.
      category: RESOURCE
      weight-per-unit: 80
      max-stack: 10
      regenerating: false
      consumable:
        gauge: THIRST
        amount: 20

    MEAD:
      display-name: Mead
      description: Honey-fermented brew.
      category: RESOURCE
      weight-per-unit: 80
      max-stack: 10
      regenerating: false
      consumable:
        gauge: THIRST
        amount: 35

    MUSHROOM_LIQUOR:
      display-name: Mushroom Liquor
      description: Distilled from fermented fungi.
      category: RESOURCE
      weight-per-unit: 80
      max-stack: 10
      regenerating: false
      consumable:
        gauge: THIRST
        amount: 25

    # ─────────────────────── Alchemy outputs (Phase 2) ────────────────────────
    # Ship inert this slice — the status-effect engine lands in a later issue.

    POISON_VIAL:
      display-name: Poison Vial
      description: Concentrated venom in a small flask. Inert until applied.
      # TODO(status-effects): on-consume apply POISON DOT
      category: RESOURCE
      weight-per-unit: 200
      max-stack: 5
      regenerating: false

    ANTIDOTE:
      display-name: Antidote
      description: Counteracts venom and toxin effects.
      # TODO(status-effects): on-consume cure POISON
      category: RESOURCE
      weight-per-unit: 200
      max-stack: 5
      regenerating: false

    STAMINA_TONIC:
      display-name: Stamina Tonic
      description: Restorative draught that revives weary muscles.
      # TODO(status-effects): on-consume refill STAMINA (+25). Needs Gauge.STAMINA
      # wiring in the consume reducer; shipped inert in this slice.
      category: RESOURCE
      weight-per-unit: 300
      max-stack: 5
      regenerating: false

    # ─────────────────────── Fauna intermediates (Phase 2) ────────────────────
    # Refined substrates fed by Slice-3 leather / bone / fur / alchemy recipes.

    HARDENED_LEATHER:
      display-name: Hardened Leather
      description: Cured and stiffened leather. Substrate for medium armor.
      category: RESOURCE
      weight-per-unit: 300
      max-stack: 99
      regenerating: false

    BONE_MEAL:
      display-name: Bone Meal
      description: Ground bone. Fertilizer and alchemy reagent.
      category: RESOURCE
      weight-per-unit: 200
      max-stack: 99
      regenerating: false

    DRIED_FUR:
      display-name: Dried Fur
      description: Cleaned and dried pelt. Ready for tailoring.
      category: RESOURCE
      weight-per-unit: 300
      max-stack: 99
      regenerating: false

    VENOM_EXTRACT:
      display-name: Venom Extract
      description: Concentrated glandular venom. Alchemy substrate.
      category: RESOURCE
      weight-per-unit: 100
      max-stack: 99
      regenerating: false

    # TODO(bow-recipe): BOWSTRING is currently orphan — no recipe consumes it.
    # Crafted via BOWSTRING_WEAVE; will be consumed by a bow recipe in the
    # ranged-weapon expansion slice. Until then, agents can craft it but it
    # has no functional use beyond being a substrate.
    BOWSTRING:
      display-name: Bowstring
      description: Woven sinew cord. Substrate for bows and fletching.
      category: RESOURCE
      weight-per-unit: 50
      max-stack: 50
      regenerating: false

    # TODO(ammo-system): BONE_ARROW ships as a stackable RESOURCE today — the
    # crafting system mints exactly one ItemInstance per EQUIPMENT recipe, so a
    # quantity-5 batch only works for stackables. When a real ammo / quiver
    # system lands, BONE_ARROW migrates to EQUIPMENT with the appropriate slot,
    # weapon-power, combat-skill, and range fields.
    BONE_ARROW:
      display-name: Bone Arrow
      description: >-
        Wood-shafted arrow tipped with a knapped bone point and fletched with
        feathers. Stackable ammunition substrate; no functional use until the
        ammo system lands.
      category: RESOURCE
      weight-per-unit: 30
      max-stack: 50
      regenerating: false

# Equipment-class items live in equipment-{weapons,armor,jewelry}.yaml (same `items.catalog` key).
# All YAML files contributing to `items.catalog` are wired through
# `ItemBalanceConfiguration.@PropertySource` and merge into a single
# `Map<String, ItemProperties>` at bind time.
