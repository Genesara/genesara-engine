# Cooking + medical recipes (#18). Inputs are harvested crops; outputs are
# value-added consumables. Cooking station is the CAMPFIRE (COOKING category);
# medical use the ALCHEMY_TABLE (CRAFTING_STATION_POTION category). Recipe-skill
# gates rise with the most demanding crop input.

recipes:
