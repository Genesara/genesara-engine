# Mob-keyed loot tables. Per-mob tuning lives inline; the runtime queries via
# `LootTableCatalog.byMob(npcType)`.
loot-tables:
  catalog:

    GRAY_WOLF:
      drops:
        - { item: HIDE, drop-chance: 0.9, quantity-min: 1, quantity-max: 2 }

    WILD_BOAR:
      drops:
        - { item: HIDE, drop-chance: 0.8, quantity-min: 1, quantity-max: 2 }

    DEER:
      drops:
        - { item: HIDE, drop-chance: 1.0, quantity-min: 1, quantity-max: 1 }

    GIANT_RAT:
      drops:
        - { item: FIBER, drop-chance: 0.5, quantity-min: 1, quantity-max: 1 }
        # Symbolic stand-in for "small forage from carcass" until a MEAT item
        # ships in the items catalog. Tuning kept low to avoid skewing food
        # economy.
        - { item: BERRY, drop-chance: 0.3, quantity-min: 1, quantity-max: 1 }

