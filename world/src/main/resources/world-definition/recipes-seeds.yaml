# Seed-bag recipes (#18). Every cultivable crop has at least one recipe whose
# inputs are forage-only (BERRY / HERB / MUSHROOM / FIBER / PEAT / CLAY) so a
# fresh agent can bootstrap the cultivation loop from day 0 without admin
# spawns. Skill gates rise in lockstep with the crop's required FARMING level.

recipes:
  catalog:

    WHEAT_SEED_BAG:
      output: { item: WHEAT_SEED, quantity: 4 }
      inputs:
        FIBER: 1
        HERB: 1
      required-station: CRAFTING_STATION_WOOD
      required-skill: FARMING
      required-skill-level: 0
      stamina-cost: 8

    POTATO_SEED_BAG:
      output: { item: POTATO_SEED, quantity: 3 }
      inputs:
        PEAT: 1
        FIBER: 1
      required-station: CRAFTING_STATION_WOOD
      required-skill: FARMING
      required-skill-level: 10
      stamina-cost: 9

    BERRY_SEED_BAG:
