      weight-per-unit: 1200
      max-stack: 1
      regenerating: false
      max-durability: 60
      valid-slots: [CHEST]
      two-handed: false
      bonuses:
        - { target: ENERGY, magnitude: 3 }
        - { target: MAGICAL, magnitude: 3 }
        - { target: INTELLIGENCE, magnitude: 2 }
