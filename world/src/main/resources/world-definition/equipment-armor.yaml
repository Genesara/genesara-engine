      category: EQUIPMENT
      weight-per-unit: 3000
      max-stack: 1
      regenerating: false
      max-durability: 120
      valid-slots: [BOOTS]
      two-handed: false
      required-attributes:
        STRENGTH: 8
      bonuses:
