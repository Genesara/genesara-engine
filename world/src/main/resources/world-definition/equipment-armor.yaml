      category: EQUIPMENT
      weight-per-unit: 1800
      max-stack: 1
      regenerating: false
      max-durability: 110
      valid-slots: [GLOVES]
      two-handed: false
      required-attributes:
        STRENGTH: 8
      bonuses:
        - { target: BLUNT, magnitude: 1 }

    # ───────────────────── T2 armor: cloth (workbench, magic-flavored) ─────────────────────

    CLOTH_HOOD:
      display-name: Cloth Hood
      description: >-
        Soft woven hood favored by alchemists and scholars. Negligible
