# Armor catalog. The `bonuses:` list under each item carries wearer-bonuses while
# the item is equipped. On armor pieces, bonus `target` values that name a damage
# type (SLASH/PIERCE/BLUNT/ENERGY/MAGICAL) are interpreted as defensive bonuses
# against that type — the binder dispatches to EquippedBonus.ArmorDef and the
# combat reducer multiplies armor-def by defender CON to get mitigation per lore §9.
#
# Magnitudes are tuned small (single digits per piece) because the combat formula
# already amplifies them by defender CON. A full iron set + CON 12 should yield
# meaningful but non-immune mitigation against an iron-tier weapon swing.

items:
  catalog:

    # ───────────────────── T1 armor: leather (workbench) ─────────────────────

    LEATHER_HELMET:
      display-name: Leather Helmet
      description: >-
        A simple boiled-leather cap. Better than going bare-headed.
      category: EQUIPMENT
      weight-per-unit: 800
      max-stack: 1
      regenerating: false
      max-durability: 60
      valid-slots: [HELMET]
      two-handed: false
      bonuses:
        - { target: SLASH, magnitude: 1 }

    LEATHER_TUNIC:
      display-name: Leather Tunic
      description: >-
        Stitched torso piece of boiled leather. Soaks light blows; cheap
        T1 chest protection.
      category: EQUIPMENT
      weight-per-unit: 1800
      max-stack: 1
      regenerating: false
      max-durability: 80
      valid-slots: [CHEST]
      two-handed: false
      bonuses:
        - { target: SLASH, magnitude: 2 }
        - { target: PIERCE, magnitude: 1 }

    LEATHER_PANTS:
      display-name: Leather Pants
      description: >-
        Reinforced leather trousers. Pairs with the tunic for a coherent
        T1 set.
      category: EQUIPMENT
      weight-per-unit: 1400
      max-stack: 1
      regenerating: false
      max-durability: 70
      valid-slots: [PANTS]
      two-handed: false
      bonuses:
        - { target: SLASH, magnitude: 1 }
        - { target: PIERCE, magnitude: 1 }

    LEATHER_BOOTS:
      display-name: Leather Boots
      description: >-
        Hard-soled leather boots. Decent ankle support; replaceable as they
        wear through.
      category: EQUIPMENT
      weight-per-unit: 900
      max-stack: 1
      regenerating: false
      max-durability: 60
      valid-slots: [BOOTS]
      two-handed: false
      bonuses:
        - { target: BLUNT, magnitude: 1 }

    LEATHER_GLOVES:
      display-name: Leather Gloves
      description: >-
        Hand-stitched riding gloves. Light protection, full dexterity.
      category: EQUIPMENT
      weight-per-unit: 400
      max-stack: 1
      regenerating: false
      max-durability: 50
      valid-slots: [GLOVES]
      two-handed: false
      bonuses:
        - { target: SLASH, magnitude: 1 }

    # ───────────────────── T2 armor: iron (forge) ─────────────────────

    IRON_HELM:
      display-name: Iron Helm
      description: >-
        Riveted iron helm with a nasal guard. Substantial protection, real
        weight on the neck.
      category: EQUIPMENT
      weight-per-unit: 2200
      max-stack: 1
      regenerating: false
      max-durability: 130
      valid-slots: [HELMET]
      two-handed: false
      required-attributes:
        STRENGTH: 8
      bonuses:
        - { target: SLASH, magnitude: 1 }
        - { target: BLUNT, magnitude: 1 }
        - { target: CONSTITUTION, magnitude: 1 }

    IRON_CHESTPLATE:
      display-name: Iron Chestplate
      description: >-
        Plate cuirass over a leather backing. Heavy front-line chest piece;
        slows mobility but blunts most strikes.
      category: EQUIPMENT
      weight-per-unit: 6000
      max-stack: 1
      regenerating: false
      max-durability: 160
      valid-slots: [CHEST]
      two-handed: false
      required-attributes:
