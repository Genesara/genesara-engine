      bonuses:
        - { target: SLASH, magnitude: 2 }
        - { target: PIERCE, magnitude: 1 }
        - { target: BLUNT, magnitude: 1 }
        - { target: CONSTITUTION, magnitude: 1 }

    IRON_GREAVES:
      display-name: Iron Greaves
      description: >-
        Articulated iron leg-plates. Trade some movement for hard kinetic
