buildings:
  catalog:

    # ───────────────────────── Inert (Phase 1 substrate-pending) ─────────────────────────
    # CAMPFIRE: cooking station hook for #8; warmth waits on a temperature gauge.

    CAMPFIRE:
      stamina-per-step: 8
      hp: 30
      category-hint: COOKING
      skill-bars:
        SURVIVAL:
          steps: 5
          materials-per-step:
            WOOD: 2
            STONE: 1

    WORKBENCH:
      stamina-per-step: 10
      hp: 60
      category-hint: CRAFTING_STATION_WOOD
      skill-bars:
        CARPENTRY:
          steps: 10
          materials-per-step:
            WOOD: 3
            STONE: 1

    FORGE:
      stamina-per-step: 12
      hp: 100
      category-hint: CRAFTING_STATION_METAL
      skill-bars:
        SMITHING:
          steps: 15
          materials-per-step:
            STONE: 2
            COAL: 1

    ALCHEMY_TABLE:
      stamina-per-step: 10
      hp: 50
      category-hint: CRAFTING_STATION_POTION
      skill-bars:
        ALCHEMY:
          steps: 12
          materials-per-step:
            WOOD: 1
            CLAY: 1

    FARM_PLOT:
      stamina-per-step: 8
      hp: 25
      category-hint: AGRICULTURE
      skill-bars:
        SURVIVAL:
          steps: 6
          materials-per-step:
            WOOD: 1
            CLAY: 2

    WOODEN_WALL:
      stamina-per-step: 10
      hp: 120
      category-hint: DEFENSIVE
      skill-bars:
        CARPENTRY:
          steps: 8
          materials-per-step:
            WOOD: 5

    # GATE: T1 defensive variant of WOODEN_WALL. Carries OPEN/CLOSED state and a
    # per-instance GATE_KEY. Toggle requires holding a matching key while on the
    # gate's node; passage is allowed only while state is OPEN. The build
    # consumes both wood (structure) and iron (hinges + lock mechanism) — the
    # IRON_INGOT requirement is what gates GATE construction behind metal-tier
    # crafting infrastructure (MINE → IRON_INGOT_BASIC → GATE).

    GATE:
      stamina-per-step: 11
      hp: 120
      category-hint: DEFENSIVE
      skill-bars:
        CARPENTRY:
          steps: 6
          materials-per-step:
            WOOD: 4
        SMITHING:
          steps: 4
          materials-per-step:
            IRON_INGOT: 1

    # ───────────────────────── Behavioral (Phase 1 wired) ─────────────────────────

    STORAGE_CHEST:
      stamina-per-step: 8
      hp: 40
      category-hint: STORAGE
      chest-capacity-grams: 50000
      skill-bars:
        CARPENTRY:
          steps: 8
          materials-per-step:
            WOOD: 3

    SHELTER:
      stamina-per-step: 10
      hp: 80
      category-hint: RESIDENCE
      skill-bars:
        CARPENTRY:
          steps: 12
          materials-per-step:
            WOOD: 3
            STONE: 1

    WELL:
      stamina-per-step: 10
      hp: 70
      category-hint: UTILITY_WATER
      skill-bars:
        CARPENTRY:
          steps: 14
          materials-per-step:
            STONE: 2
            WOOD: 1

    ROAD:
      stamina-per-step: 8
      hp: 50
      category-hint: INFRASTRUCTURE_ROAD
      skill-bars:
        SURVIVAL:
          steps: 6
          materials-per-step:
            STONE: 3
            CLAY: 1

    BRIDGE:
      stamina-per-step: 12
      hp: 90
      category-hint: INFRASTRUCTURE_BRIDGE
      skill-bars:
        CARPENTRY:
          steps: 16
          materials-per-step:
            WOOD: 3
            STONE: 2

    # ───────────────────────── Tier-2 (Phase 2: this slice) ─────────────────────────
    # T2 buildings declare multiple skill-bars. Each bar advances independently when
    # the lead calls `build(type, skill)` — a polymath can fill all bars alone, two
    # specialists collaborate by alternating calls. No co-presence required: the
    # progress bars themselves encode complementary contribution.
    #
    # Interim T2 gate: per-bar skill levels carry the friction until Phase 3 lands
    # the canonical `node.baseBuilding.tier >= 2` check.

    WATCHTOWER:
      stamina-per-step: 12
      hp: 90
      category-hint: VISION
      skill-bars:
        CARPENTRY:
          level: 15
          steps: 8
          materials-per-step:
            PLANK: 2
            IRON_INGOT: 1
        SURVIVAL:
          level: 10
          steps: 6
          materials-per-step:
            STONE: 3

    TRADING_POST:
      stamina-per-step: 10
      hp: 60
      category-hint: COMMERCE
      skill-bars:
        CARPENTRY:
          level: 20
          steps: 12
          materials-per-step:
            PLANK: 2
            STONE: 1

    # STABLE: inert in this slice. Mount housing + taming-anchor behavior lands in
    # the Mounts issue (#21). The build gate + materials are wired now so the
    # building can be placed; behavior wiring is deferred.

    STABLE:
      stamina-per-step: 10
      hp: 50
      category-hint: ANIMAL_HOUSING
      skill-bars:
        CARPENTRY:
          level: 15
          steps: 6
          materials-per-step:
            PLANK: 2
            FIBER: 1
        ANIMAL_HANDLING:
          level: 10
          steps: 6
          materials-per-step:
            STONE: 2

    # ───────────────────────── Extraction infrastructure (T1) ─────────────────────────
    # MINE gates access to `extract`-only resources (COAL, ORE, GOLD). Buildable only
    # on rocky terrain (FOOTHILLS / MOUNTAIN / VOLCANIC) — enforced at the reducer.
    # Build materials are intentionally IRON-free so a fresh agent on a virgin world
    # can bootstrap metal-tier crafting: WOOD + STONE are bare-gatherable.

    MINE:
      stamina-per-step: 12
      hp: 80
      category-hint: EXTRACTION_MINE
      skill-bars:
        CARPENTRY:
          steps: 10
          materials-per-step:
            WOOD: 3
            STONE: 4
