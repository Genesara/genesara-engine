# Biome defaults: stamina-cost-multiplier=0.0, node-npc-capacity=0
#
# node-npc-capacity caps how many Tier-A NPCs the lazy-on-entry seeder will
# place in a single node of this biome. Pick from npcs.yaml entries whose
# spawn-biomes includes this biome, weighted by `spawn-weight`. 0 disables
# fauna spawning in the biome (OCEAN today).
world:
  biomes:
    FOREST:
      display-name: Forest
      node-npc-capacity: 2
    PLAINS:
      display-name: Plains
      node-npc-capacity: 2
    MOUNTAIN:
      display-name: Mountain
      stamina-cost-multiplier: 2.0
      node-npc-capacity: 1
    COASTAL:
      display-name: Coastal
      node-npc-capacity: 1
    SWAMP:
      display-name: Swamp
      stamina-cost-multiplier: 1.5
      node-npc-capacity: 1
    RUINS:
      display-name: Ruins
      node-npc-capacity: 1
    DESERT:
      display-name: Desert
      stamina-cost-multiplier: 2.5
      node-npc-capacity: 1
    TUNDRA:
      display-name: Tundra
      stamina-cost-multiplier: 2.5
      node-npc-capacity: 1
    OCEAN:
      display-name: Ocean
      node-npc-capacity: 0
