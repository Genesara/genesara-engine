# Each crop's `seed-item` is the crop's own output. Planting consumes one unit
# of the harvested crop. Wild starter units come from low-rate terrain spawns
# (see terrains.yaml resource-spawns) — forage one, plant it, grow more.
#
# Tick balance: `application.tick.interval = PT1S`, so 3600 ticks = 1 hour.
# All crops fall in the 6–18h ripening / 4–5h neglect-window range. Lower-tier
# crops are forgiving (5h tend cadence); higher-tier crops are demanding
# (4h cadence over a longer growth so the agent must tend several times).

crops:
  catalog:

    WHEAT:
      seed-item: WHEAT
      ticks-to-ripe: 21600        #  6h
      output-item: WHEAT
      base-yield: 4
      neglect-window-ticks: 18000 #  5h
      required-terrain: [PLAINS, MEADOW]
      required-farming-level: 0
      gain-per-level: 0.05
      max-luck-bonus: 2
      stamina-cost-plant: 6
      stamina-cost-tend: 4
      stamina-cost-harvest: 8

