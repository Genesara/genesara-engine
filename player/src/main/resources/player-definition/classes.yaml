        SOCIAL: 0.1
        EXPLORE: 0.7
        MEDICAL: 0.1
        TRADE: 0.2
      evolutions: [BEASTMASTER, TRAPPER, POACHER]

    ARTISAN:
      display-name: Artisan
      description: >-
        Workshop generalist. Forge, loom, kiln, and stove — the artisan turns
