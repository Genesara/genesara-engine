              ability-target: SELF
              cooldown-ticks: 15
              ability-effect-kind: GRANT_SELF_BUFF
              ability-effect-params:
                buff: WATER_DASH
                duration-ticks: "4"
                speedBonusPct: "40"
          - id: SWIMMING_TIDE_RHYTHM
            display-name: Tide Rhythm
