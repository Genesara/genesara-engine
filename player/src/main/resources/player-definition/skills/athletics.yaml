                thresholdPct: "30"
              internal-cooldown-ticks: 60
        "100":
          - id: CLIMBING_SCALE_CLIMB
            display-name: Scale Climb
            description: Active — pay 12 Stamina, gain a temporary max-carry-weight buff.
            effect:
              type: ACTIVE_ABILITY
              ability-id: CLIMBING_SCALE_CLIMB
              cost-resource: STAMINA
