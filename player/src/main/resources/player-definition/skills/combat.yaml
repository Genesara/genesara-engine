skills:
  catalog:

    SWORD:
      display-name: Swordsmanship
      description: One-handed slashing weapons.
      category: COMBAT
      level-effect:
        type: SLASH_DAMAGE_BONUS
        per-level-pct: 0.005
      milestones:
        "50":
          - id: SWORD_BLEEDER
            display-name: Bleeder
            description: >-
              A successful sword strike applies the Bleed status to the target.
            effect:
              type: TRIGGERED_PASSIVE
              trigger: ON_HIT_DEALT
              effect-kind: APPLY_STATUS_TO_TARGET
              params:
                status: BLEED
                duration-ticks: "10"
              internal-cooldown-ticks: 8
          - id: SWORD_SHARPEN_EDGE
            display-name: Sharpen Edge
            description: >-
              Permanent +5 flat slash damage while a sword is wielded.
            effect:
              type: PASSIVE_AURA
              aura-target: SLASH_DAMAGE_BONUS
              aura-magnitude: 5
        "100":
          - id: SWORD_POWER_STRIKE
            display-name: Power Strike
            description: >-
              Active ability — pay 20 Stamina, the next basic attack within the
              cooldown window deals 1.5× damage. Targets a single agent in the
              caster's node; the buff is consumed by the next attack regardless
              of dodge/crit outcome.
            effect:
              type: ACTIVE_ABILITY
              ability-id: SWORD_POWER_STRIKE
              cost-resource: STAMINA
              cost-amount: 20
              ability-target: SINGLE_AGENT
              cooldown-ticks: 5
              ability-effect-kind: SCALE_NEXT_ATTACK
              ability-effect-params:
                multiplierPct: "150"
          - id: SWORD_RIPOSTE
            display-name: Riposte
            description: >-
              On a successful dodge, the next basic attack lands as a guaranteed
              follow-up. Slot-1 perk — TriggeredPassive shape mirrors Bleeder.
            effect:
              type: TRIGGERED_PASSIVE
              trigger: ON_DODGE
              effect-kind: GRANT_SELF_BUFF
              params:
                buff: RIPOSTE_READY
                duration-ticks: "3"
              internal-cooldown-ticks: 6
        "150":
          - id: SWORD_DOUBLED_EDGE
            display-name: Doubled Edge
            description: >-
              Doubles the slash damage scaling rate from sword level — every level
              counts twice for SLASH_DAMAGE_BONUS.
            effect:
              type: MODIFIER
              modifier-target: SLASH_DAMAGE_BONUS
              multiplier: 2.0
          - id: SWORD_PRECISION
            display-name: Precision
            description: >-
              Permanent +10 flat slash damage while a sword is wielded.
            effect:
              type: PASSIVE_AURA
              aura-target: SLASH_DAMAGE_BONUS
              aura-magnitude: 10

