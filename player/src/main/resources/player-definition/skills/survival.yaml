            effect:
              type: PASSIVE_AURA
              aura-target: CRAFT_QUALITY_BONUS
              aura-magnitude: 3
          - id: FIRECRAFT_KINDLING_KEEPER
            display-name: Kindling Keeper
            description: On craft complete, refunds a small amount of fuel.
